# MediaMusicService 配置文件
# 所有项均可选，缺省走默认值。纯内网自用建议保持最小配置。
#
# 配置原则：本文件是唯一配置源（核心服务 + MCP 适配器共用），
# 环境变量仅作为覆盖手段（MUSIC_SERVICE_* / MUSIC_MCP_*），docker-compose.yml 里不再单独配。
#
# 【重要】Docker 部署时，本文件里的所有路径都必须填【容器内路径】
# （即 docker-compose.yml volumes 冒号右侧的路径，如 /app/downloads），
# 填宿主机路径会导致文件写进容器临时层：下载"成功"但宿主机上看不到文件、重启后丢失。

server:
  host: "0.0.0.0"
  port: 8765

# 下载文件根目录（容器内路径，对应 compose 中 downloads 卷的挂载点）
download_root: "./downloads"

# 任务/历史数据库（容器内路径，对应 compose 中 data 卷的挂载点）
db_path: "./data/music_service.db"

# 媒体库根目录（archive_album 归档目标，结构：{library_root}/{艺人}/{专辑}/）
# 不配则归档端点不可用；Docker 部署时需同时挂载媒体库卷（见 docker-compose.yml）
library_root: "/library"

# 命名附加库根（可选）：按库名区分归档目标，如单曲库。调用方传库名而非裸路径
extra_library_roots:
  singles: "/singles"

# 归档时统一写入音频文件的 COMMENT tag（用于标记整理来源、覆盖平台水印）
archive_comment: "yangds整理"

# 单文件体积上限（MB）：超出则专辑匹配跳过该候选、单曲下载直接拒绝
# 0 或留空不限；接口传参（max_size_mb > 0）优先于此配置
# 注：专辑匹配中若某曲候选全部超限，会自动放宽限制下载（保专辑完整性），manifest 标注 oversized_relaxed
# max_size_mb: 100

# 下载目录清理规则（白名单制：只删服务自建的任务目录与 musicdl 源缓存目录，不碰其他文件）
cleanup:
  after_archive: true  # 归档成功后自动清理该任务的下载产物（全成功整目录清，部分成功只清已入库曲目）
  periodic: true       # 定期扫描下载目录占用
  interval_s: 21600    # 扫描周期（秒），默认 6 小时
  max_size_gb: 10      # 下载目录占用阈值（GB），超过才触发清理
  keep_hours: 24       # 近 N 小时的任务目录保护期（不删）

# 每个源的下载线程数
num_threads: 5

# 可选 API Key；留空或删除本行则不启用鉴权（纯内网自用推荐）
# api_key: "change-me"

# 默认搜索源（musicdl 官方默认五源）
default_sources:
  - MiguMusicClient
  - NeteaseMusicClient
  - QQMusicClient
  - KuwoMusicClient
  - QianqianMusicClient

# 按需配置各源 cookies；不配置的源如果必须登录态会被标记为不可用
# 示例：
# sources:
#   QQMusicClient:
#     search_cookies: "你的QQ音乐cookies"
#     download_cookies: "你的QQ音乐cookies"
#   TIDALMusicClient:
#     parse_cookies: "你的TIDAL cookies"
#   MituMusicClient:
#     quark_cookies: "你的夸克网盘cookies"
sources: {}

# MCP 适配器配置（仅供 mcp_adapter.py 读取，核心服务忽略本段）
# 优先级：环境变量（MUSIC_MCP_TRANSPORT/MUSIC_MCP_HOST/MUSIC_MCP_PORT/MUSIC_SERVICE_URL）> 本配置 > 默认值
# 鉴权复用顶层 api_key 项，MCP 侧无需单独配置
mcp:
  transport: "stdio"  # stdio：本地 Agent 直接拉起（默认）；http：远程 Agent（docker compose mcp-adapter 需改为 http）
  host: "0.0.0.0"     # http 模式监听地址
  port: 8766          # http 模式监听端口
  service_url: "http://127.0.0.1:8765"  # 核心 REST 服务地址；docker 部署时改为 http://music-service:8765

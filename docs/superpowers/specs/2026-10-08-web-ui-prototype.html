<style>
  /* 原型补充样式：Vuetify 之外的最小自定义 */
  html { overflow-y: auto; }
  /* 借鉴 go-music-dl：顶部三色径向渐变光晕，向下渐隐 */
  .v-main::before { content:''; position:fixed; top:0; left:0; right:0; height:600px; z-index:0;
    pointer-events:none;
    background:
      radial-gradient(ellipse 50% 60% at 15% 0%, rgba(16,185,129,.16), transparent 70%),
      radial-gradient(ellipse 45% 55% at 55% 0%, rgba(99,102,241,.12), transparent 70%),
      radial-gradient(ellipse 50% 60% at 90% 0%, rgba(52,211,153,.14), transparent 70%); }
  .v-main > * { position: relative; z-index: 1; }
  /* 渐变文字（Logo/主标题） */
  .grad-text { background: linear-gradient(135deg,#34d399,#059669);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  /* 卡片圆角加大 + hover 上浮 */
  .v-card { border-radius: 16px !important; }
  .v-card[href], .v-card.cursor-p { transition: transform .18s ease, box-shadow .18s ease; }
  .v-card[href]:hover, .v-card.cursor-p:hover { transform: translateY(-2px); }
  /* 胶囊搜索按钮 */
  .btn-pill { border-radius: 999px !important; }
  .proto-cover { display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:600; border-radius:8px; }
  .q-flac { background:#2e7d32; } .q-320 { background:#1565c0; } .q-other { background:#757575; }
  .track-row-mobile { border-bottom: 1px solid rgba(128,128,128,.18); }
  .sticky-bar { position: fixed; left:0; right:0; bottom:0; z-index: 1006;
    box-shadow: 0 -2px 12px rgba(0,0,0,.18); }
  @media (max-width:959px){ .sticky-bar { bottom: 64px; } } /* 避开手机底部Tab */
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .proto-banner { position: sticky; top: 64px; z-index: 5; }
  .cursor-p { cursor: pointer; }
</style>

/* 模拟任务轮询：仅任务中心页面激活时推进 running 进度 */
let pollTimer = null;
function startPolling(){
  stopPolling();
  pollTimer = setInterval(() => {
    store.tasks.forEach(t => {
      if (t.status === 'running' && t.done < t.total){
        t.done++;
        if (t.done >= t.total){ t.status = 'success'; store.toast(`任务完成：${t.title}`); }
      }
    });
  }, 3000);
}
function stopPolling(){ if (pollTimer){ clearInterval(pollTimer); pollTimer = null; } }

  template: `<v-chip size="x-small" :class="['text-white', quality==='FLAC'?'q-flac':(quality==='320k'?'q-320':'q-other')]" label>{{ quality==='FLAC'?'无损':quality }}</v-chip>`
};
const SrcChip = {
  props:['source'],
  methods:{ short(s){ return ({MiguMusicClient:'咪咕',NeteaseMusicClient:'网易',QQMusicClient:'QQ',KuwoMusicClient:'酷我',QianqianMusicClient:'千千'})[s] || s; } },

};
const StatusChip = {
  props:['status'],
  template: `<v-chip size="small" :color="({pending:'blue',running:'green',success:'grey',failed:'red'})[status]" variant="tonal" label>{{ ({pending:'等待中',running:'下载中',success:'已完成',failed:'失败'})[status] }}</v-chip>`
};
/* 曲目勾选列表：PC 表格 / 手机卡片 双渲染 */
const TrackPicker = {
  props:['tracks','modelValue'],
  emits:['update:modelValue'],
  components:{ QualityChip, SrcChip },
  computed:{
    selected:{ get(){ return this.modelValue; }, set(v){ this.$emit('update:modelValue', v); } },
    allChecked(){ return this.selected.length === this.tracks.length && this.tracks.length>0; },
  },
  methods:{
    toggleAll(){ this.selected = this.allChecked ? [] : this.tracks.map(t=>t.title+t.source); },
    keyOf(t){ return t.title+t.source; },
    toggle(k){ const i=this.selected.indexOf(k); i>=0?this.selected.splice(i,1):this.selected.push(k); },
  },
  template: `
  <div>
    <!-- PC 表格 -->
    <v-table class="d-none d-md-table" density="comfortable">
      <thead><tr>
        <th style="width:40px"><v-checkbox-btn :model-value="allChecked" @update:model-value="toggleAll"></v-checkbox-btn></th>
        <th>歌名</th><th>歌手</th><th>专辑</th><th>时长</th><th>音质</th><th>大小</th><th>来源</th>
      </tr></thead>
      <tbody>
        <tr v-for="t in tracks" :key="keyOf(t)" class="cursor-p" @click="toggle(keyOf(t))">
          <td><v-checkbox-btn :model-value="selected.includes(keyOf(t))" @click.stop @update:model-value="toggle(keyOf(t))"></v-checkbox-btn></td>
          <td>{{ t.title }}</td><td>{{ t.artist }}</td><td>{{ t.album }}</td>
          <td class="mono">{{ t.duration }}</td>
          <td><QualityChip :quality="t.quality"/></td>
          <td class="mono">{{ t.size }}</td>
          <td><SrcChip :source="t.source"/></td>
        </tr>
      </tbody>
    </v-table>
    <!-- 手机卡片流 -->
    <div class="d-md-none">
      <div class="d-flex align-center px-2 py-1">
        <v-checkbox-btn :model-value="allChecked" @update:model-value="toggleAll"></v-checkbox-btn>
        <span class="text-caption text-medium-emphasis">全选（{{ selected.length }}/{{ tracks.length }}）</span>
      </div>
      <div v-for="t in tracks" :key="keyOf(t)" class="d-flex align-center px-2 py-2 track-row-mobile" @click="toggle(keyOf(t))">
        <v-checkbox-btn :model-value="selected.includes(keyOf(t))" @click.stop @update:model-value="toggle(keyOf(t))"></v-checkbox-btn>
        <div class="flex-grow-1 ml-1" style="min-width:0">
          <div class="text-body-2 text-truncate">{{ t.title }} <span class="text-medium-emphasis">- {{ t.artist }}</span></div>
          <div class="text-caption text-medium-emphasis text-truncate">{{ t.album }} · {{ t.duration }} · {{ t.size }}</div>
        </div>
        <QualityChip :quality="t.quality" class="ml-2"/><SrcChip :source="t.source" class="ml-1"/>
      </div>
    </div>
  </div>`
};

/* ---------------- 页面：搜索下载 ---------------- */
const PageSearch = {
  components:{ TrackPicker, DownloadDialog },
  data(){ return { keyword:'周杰伦', srcFilter:[], sources: SOURCES,
    searched:true, results: ALL_TRACKS, selected:[], dlg:false, searching:false }; },
  methods:{
    doSearch(){
      this.searching = true;
      setTimeout(()=>{
        const kw = this.keyword.trim();
        this.results = ALL_TRACKS.filter(t =>
          (!kw || (t.title+t.artist+t.album).includes(kw)) &&
          (!this.srcFilter.length || this.srcFilter.includes(t.source)));
        this.searched = true; this.searching = false; this.selected = [];
      }, 400);
    },
    submit(opts){
      store.addTask({ kind:'single', title:`勾选的 ${this.selected.length} 首单曲`, status:'pending',
        done:0, total:this.selected.length, library:opts.library, elapsed:'-', errors:[],
        playlist: opts.playlist });
      store.toast(`已提交 ${this.selected.length} 首下载`);
      this.selected = [];
      this.$router.push('/tasks');
    },
  },
  template: `
  <v-container fluid class="pa-4" style="padding-bottom:96px">
    <div class="d-flex ga-2 flex-wrap align-center mb-3">

const PageTasks = {
  components:{ StatusChip },
  data(){ return { tab:'running', archiveDlg:false, archiveTarget:null, archiveLib:'default',
    va:false, archiveResult:null }; },
  computed:{
    active(){ return store.tasks.filter(t=>t.status==='running'||t.status==='pending'); },
    finished(){ return store.tasks.filter(t=>t.status==='success'||t.status==='failed'); },
    history(){ return store.history; },
  },
  mounted(){ startPolling(); },
  unmounted(){ stopPolling(); },
  methods:{
    cancel(t){ if(t.status==='pending'){ t.status='failed'; t.errors=['已取消']; store.toast('任务已取消','info'); } },
    openArchive(t){ this.archiveTarget=t; this.archiveResult=null; this.archiveDlg=true; },
    doArchive(){
      const total=this.archiveTarget.total;
      this.archiveResult = [
        { n:1, title:'以父之名', st:'ok', msg:'已入库' }, { n:2, title:'懦夫', st:'ok', msg:'已入库' },
        { n:3, title:'晴天', st:'skip', msg:'已存在，幂等跳过' }, { n:8, title:'她的睫毛', st:'fail', msg:'匹配分数 0.52 < 阈值，unmatched' },
      ];
      this.archiveTarget.archived = true;
      store.toast('归档完成：成功 '+(total-2)+' / 跳过 1 / 失败 1');
    },
    retryTrack(item){ this.archiveDlg=false; this.$router.push('/search'); store.toast(`已跳转搜索页，重搜「${item.title}」`,'info'); },
  },
  template: `
  <v-container fluid class="pa-4" style="max-width:900px">
    <v-alert type="warning" variant="tonal" density="compact" closable class="mb-3">
      服务重启后进行中的任务状态会丢失，完整记录见「历史」Tab
    </v-alert>
    <v-tabs v-model="tab" class="mb-3">
      <v-tab value="running">进行中 <v-badge v-if="active.length" :content="active.length" color="primary" inline/></v-tab>
      <v-tab value="done">已结束</v-tab>
      <v-tab value="history">历史</v-tab>

        <v-card-text>
          <div class="d-flex align-center flex-wrap ga-2 mb-2">

            <span class="text-body-1 font-weight-medium">{{ t.title }}</span><v-spacer/>
            <StatusChip :status="t.status"/>
          </div>
          <v-progress-linear v-if="t.status==='running'" :model-value="t.done/t.total*100" color="green" height="10" rounded class="mb-1"/>
          <div class="d-flex align-center text-caption text-medium-emphasis">
            <span>{{ t.done }}/{{ t.total }} 首 · 目标库 {{ t.library }} · 已用时 {{ t.elapsed }}</span><v-spacer/>
            <v-btn size="small" variant="text" color="red" :disabled="t.status!=='pending'"
              :title="t.status!=='pending'?'运行中任务不可中断':''" @click="cancel(t)">取消</v-btn>
          </div>
        </v-card-text>
      </v-card>

    <template v-if="tab==='done'">

              </template>
              <v-list-item-title>{{ r.n }}. {{ r.title }}</v-list-item-title>
              <v-list-item-subtitle>{{ r.msg }}</v-list-item-subtitle>

        <v-card-actions><v-spacer/>

const PageLibrary = {

  }; },
  methods:{
    open(kind){ this.dlg=kind; this.form={}; this.preview=null; this.result=null; this.confirmWhole=false; },

      const n = { backfill:7, migrate:2, cleanup:3 }[this.dlg] || 0;

    },
    execute(){
      this.result = `执行完成：共处理 ${this.preview?this.preview.length:1} 项，失败 0`;
      store.toast('操作已完成');
      if (this.dlg==='backfill') store.toast('提示：回填后需在飞牛侧触发重扫（目录移出再移回）','info');

  },
  template: `

    save(){ store.toast('已热生效 5 项；3 项（路径/线程数）需重启服务后生效'); },
    openQr(key, label){
      this.closeQr(true);
      this.qr.show = true; this.qr.key = key; this.qr.label = label; this.qr.status = 'waiting';
      this.qr.cells = this.genQr();
      this.qr.timers.push(setTimeout(()=>{ this.qr.status='scanned'; }, 2000));
      this.qr.timers.push(setTimeout(()=>{
        this.qr.status='success';
        this.cfg[key] = '扫码获取·'+new Date().toLocaleTimeString();
        store.toast(this.label+'登录成功，Cookies 已回填并热生效');
        this.qr.timers.push(setTimeout(()=>this.closeQr(), 900));
      }, 4500));
    },
    closeQr(keepShow){
      this.qr.timers.forEach(clearTimeout); this.qr.timers = [];
      if (!keepShow) this.qr.show = false;
    },
    genQr(){ /* 伪二维码：21×21 随机点阵 + 三个定位角，仅供原型演示 */
      const n=21, cells=new Array(n*n).fill(false);
      const finder=(x,y)=>{ for(let i=0;i<7;i++)for(let j=0;j<7;j++){
        const edge=(i===0||i===6||j===0||j===6), core=(i>=2&&i<=4&&j>=2&&j<=4);
        cells[(y+i)*n+(x+j)] = edge||core; } };
      for(let i=0;i<n*n;i++) cells[i]=Math.random()<0.42;
      finder(0,0); finder(n-7,0); finder(0,n-7);
      return cells; },

/* ---------------- 路由 ---------------- */
const routes = [
  { path:'/', component:PageDashboard, meta:{ title:'仪表盘', icon:'mdi-view-dashboard' } },
  { path:'/search', component:PageSearch, meta:{ title:'搜索下载', icon:'mdi-magnify' } },
  { path:'/albums', component:PageAlbums, meta:{ title:'专辑', icon:'mdi-album' } },
  { path:'/albums/:id', component:PageAlbumDetail, meta:{ title:'专辑详情', icon:'mdi-album' } },
  { path:'/tasks', component:PageTasks, meta:{ title:'任务中心', icon:'mdi-download-circle' } },
  { path:'/charts', component:PageCharts, meta:{ title:'榜单', icon:'mdi-chart-line' } },
  { path:'/charts/:source/:id', component:PageChartTracks, meta:{ title:'榜单曲目', icon:'mdi-chart-line' } },
  { path:'/playlist', component:PagePlaylist, meta:{ title:'歌单解析', icon:'mdi-playlist-music' } },
  { path:'/library', component:PageLibrary, meta:{ title:'媒体库', icon:'mdi-folder-music' } },
  { path:'/fnos', component:PageFnos, meta:{ title:'飞牛歌单', icon:'mdi-playlist-star' } },
  { path:'/fnos/:name', component:PageFnosDetail, meta:{ title:'歌单详情', icon:'mdi-playlist-star' } },
  { path:'/settings', component:PageSettings, meta:{ title:'设置', icon:'mdi-cog' } },
  { path:'/login', component:PageLogin, meta:{ title:'登录', plain:true } },
];
const PRIMARY = ['/', '/search', '/albums', '/tasks', '/settings'];   // 手机底部 Tab
const router = createRouter({ history: createWebHashHistory(), routes });
router.beforeEach((to) => { if (!store.loggedIn && to.path !== '/login') return '/login'; });

/* ---------------- 应用壳 ---------------- */
const AppShell = {
  data(){ return { drawer:false, dark:false }; },
  computed:{
    route(){ return this.$route; },
    title(){ return this.$route.meta.title || ''; },
    isMobile(){ return !this.$vuetify.display.mdAndUp; },
    isLogin(){ return this.$route.path === '/login'; },
    primaryNav(){ return routes.filter(r=>PRIMARY.includes(r.path)); },
    secondaryNav(){ return routes.filter(r=>!PRIMARY.includes(r.path) && !r.meta.plain && !r.path.includes(':')); },
    runningCount(){ return store.tasks.filter(t=>t.status==='running'||t.status==='pending').length; },
  },
  watch:{ dark(v){ this.$vuetify.theme.global.name = v ? 'dark' : 'light'; } },
  methods:{
    logout(){ localStorage.removeItem('proto_key'); store.apiKey = null; this.$router.push('/login'); },
    navItem(r){ return { title:r.meta.title, icon:r.meta.icon, to:r.path }; },
  },
  template: `
  <v-app>
    <template v-if="isLogin"><router-view/></template>
    <template v-else>
      <v-app-bar color="primary" density="comfortable">
        <v-app-bar-nav-icon v-if="isMobile" @click="drawer=!drawer"/>
        <v-app-bar-title class="text-truncate">{{ title }}</v-app-bar-title>
        <v-btn icon :title="dark?'切换浅色':'切换深色'" @click="dark=!dark">
          <v-icon>{{ dark?'mdi-weather-sunny':'mdi-weather-night' }}</v-icon></v-btn>
        <v-btn icon title="更换密钥 / 退出" @click="logout"><v-icon>mdi-key-variant</v-icon></v-btn>
      </v-app-bar>

      <v-navigation-drawer v-model="drawer" :permanent="!isMobile" :temporary="isMobile">
        <v-list density="compact" nav>
          <v-list-item title="MediaMusicService" subtitle="Web UI 原型 v0.1" class="mb-2">
            <template #prepend><v-icon color="primary" size="32">mdi-music-circle</v-icon></template>
          </v-list-item>
          <v-divider class="mb-2"/>
          <v-list-item v-for="r in primaryNav" :key="r.path" v-bind="navItem(r)" rounded="lg">
            <template #append v-if="r.path==='/tasks' && runningCount">
              <v-badge :content="runningCount" color="primary" inline/></template>
          </v-list-item>
          <v-divider class="my-2"/>
          <v-list-item v-for="r in secondaryNav" :key="r.path" v-bind="navItem(r)" rounded="lg"/>
        </v-list>
      </v-navigation-drawer>

      <v-main><router-view/></v-main>

      <v-bottom-navigation v-if="isMobile" grow color="primary" height="64" style="position:fixed">
        <v-btn v-for="r in primaryNav" :key="r.path" :to="r.path">
          <v-badge v-if="r.path==='/tasks' && runningCount" :content="runningCount" color="red" offset-x="8" offset-y="2">
            <v-icon>{{ r.meta.icon }}</v-icon></v-badge>
          <v-icon v-else>{{ r.meta.icon }}</v-icon>
          <span>{{ r.meta.title }}</span>
        </v-btn>
      </v-bottom-navigation>
    </template>

    <v-snackbar v-model="store.snack.show" :color="store.snack.color" timeout="2500" location="top">
      {{ store.snack.text }}
    </v-snackbar>
  </v-app>`
};

/* ---------------- 启动 ---------------- */
const vuetify = Vuetify.createVuetify({
  theme: { defaultTheme: (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light',
    themes: { light: { colors: { primary: '#10b981' } }, dark: { colors: { primary: '#34d399' } } } },
});
const app = createApp(AppShell);
app.config.globalProperties.store = store;
app.use(router); app.use(vuetify);
app.mount('#app');
</script>
</body>
</html>
